openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: scripts
  - name: user
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scripts:
    get:
      operationId: listScripts
      tags: [scripts]
      security:
        - bearerAuth: []
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [TikTok, Instagram, YouTube]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of scripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Script"
                  total:
                    type: integer
                required: [scripts, total]
    post:
      operationId: generateScript
      tags: [scripts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScriptBody"
      responses:
        "201":
          description: Generated script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "402":
          description: Free limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitReachedError"

  /scripts/stats:
    get:
      operationId: getScriptStats
      tags: [scripts]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptStats"

  /scripts/{id}:
    get:
      operationId: getScript
      tags: [scripts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "404":
          description: Not found
    delete:
      operationId: deleteScript
      tags: [scripts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/checkout:
    post:
      operationId: createCheckout
      tags: [user]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required: [url]

  /user/stripe-webhook:
    post:
      operationId: stripeWebhook
      tags: [user]
      responses:
        "200":
          description: Acknowledged

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Script:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        topic:
          type: string
        targetAudience:
          type: string
        tone:
          type: string
          enum: [Funny, Professional, Aggressive, Hype, Inspirational, Educational, Storytelling]
        platform:
          type: string
          enum: [TikTok, Instagram, YouTube]
        title:
          type: string
        hook:
          type: string
        body:
          type: string
        callToAction:
          type: string
        script:
          type: string
        hookLab:
          type: array
          items:
            type: string
        aiReasoning:
          type: string
        hashtags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - topic
        - targetAudience
        - tone
        - platform
        - title
        - hook
        - body
        - callToAction
        - script
        - hookLab
        - aiReasoning
        - hashtags
        - createdAt

    GenerateScriptBody:
      type: object
      properties:
        topic:
          type: string
        targetAudience:
          type: string
        tone:
          type: string
          enum: [Funny, Professional, Aggressive, Hype, Inspirational, Educational, Storytelling]
        platform:
          type: string
          enum: [TikTok, Instagram, YouTube]
      required:
        - topic
        - platform

    ScriptStats:
      type: object
      properties:
        total:
          type: integer
        byPlatform:
          type: object
          properties:
            TikTok:
              type: integer
            Instagram:
              type: integer
            YouTube:
              type: integer
          required: [TikTok, Instagram, YouTube]
        thisWeek:
          type: integer
      required: [total, byPlatform, thisWeek]

    UserProfile:
      type: object
      properties:
        id:
          type: string
        isPro:
          type: boolean
        scriptsRemaining:
          type: integer
        stripeCustomerId:
          type: string
          nullable: true
      required: [id, isPro, scriptsRemaining]

    LimitReachedError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        scriptsRemaining:
          type: integer
      required: [error, code, scriptsRemaining]
